services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: systemsafety_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: systemsafety
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: systemsafety_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./IOT/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

volumes:
  pgdata: